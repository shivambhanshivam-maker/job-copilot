server.port=${PORT:8084}

spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true

# data.sql runs on every startup to seed role categories.
# To wipe everything: drop all tables in Neon console and restart.
spring.sql.init.mode=always

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-5.2

# JSearch (RapidAPI) config
jsearch.api.key=${JSEARCH_API_KEY}

# Gmail polling config
gmail.credentials.path=${GMAIL_CREDENTIALS_PATH:/credentials.json}
gmail.credentials.json=${GMAIL_CREDENTIALS_JSON:}
gmail.tokens.directory=tokens
gmail.poll.interval=60000
gmail.poll.max-results=20
gmail.oauth.redirect-uri=${GMAIL_REDIRECT_URI:http://localhost:8084/api/gmail/callback}

# Frontend URL — used for post-OAuth redirects
app.frontend.url=${FRONTEND_URL:http://localhost:4200}

# CORS — comma-separated list of allowed origins
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200,http://localhost:58637}

# Signup control — set to false to block new registrations
app.signup.enabled=${SIGNUP_ENABLED:true}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000
